name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $root = Get-ChildItem ffmpeg_x -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe" ffmpeg\

      - name: Build MoM_Toolbox.exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean MoM_Toolbox.spec

      - name: Add ffmpeg to the build
        shell: pwsh
        run: Copy-Item -Recurse ffmpeg dist\MoM_Toolbox\ffmpeg

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip "release\MoM_Toolbox_Portable_v$env:VERSION.zip" .\dist\MoM_Toolbox

      - name: Create Setup.exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MoM Toolbox v${{ env.VERSION }}
          files: |
            release/*.exe
            release/*.zip
          body: |
            **Download one of the files below (Windows 10/11, 64-bit):**
            - `MoM_Toolbox_Setup_v${{ env.VERSION }}.exe` - installer with desktop and Start-menu shortcuts
            - `MoM_Toolbox_Portable_v${{ env.VERSION }}.zip` - no install; unzip and run `MoM_Toolbox.exe`

            If Windows shows "Windows protected your PC", click **More info -> Run anyway**.
