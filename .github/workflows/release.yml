name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

env:
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") { $v = $env:INPUT_VERSION } else { $v = $env:REF_NAME.TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3 (got '$v')" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python packages (hash-verified)
        shell: pwsh
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Download ffmpeg (checksum-verified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $h = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          if ($h -ne $env:FFMPEG_SHA256) { throw "ffmpeg checksum mismatch: $h" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $root = Get-ChildItem ffmpeg_x -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe", "$($root.FullName)\bin\ffprobe.exe" ffmpeg\

      - name: Build MoM_Toolbox.exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean MoM_Toolbox.spec

      - name: Add ffmpeg to the build
        shell: pwsh
        run: Copy-Item -Recurse ffmpeg dist\MoM_Toolbox\ffmpeg

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          7z a -tzip "release\MoM_Toolbox_Portable_v$env:VERSION.zip" .\dist\MoM_Toolbox

      - name: Install Inno Setup (checksum-verified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile innosetup.exe
          $h = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash
          if ($h -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $h" }
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Start-Process -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup install failed" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Setup.exe
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=$env:VERSION" installer.iss'

      - name: Create SHA256SUMS.txt
        shell: pwsh
        run: |
          Push-Location release
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.VERSION }}
          name: MoM Toolbox v${{ env.VERSION }}
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          body: |
            **Download one of the files below (Windows 10/11, 64-bit):**
            - `MoM_Toolbox_Setup_v${{ env.VERSION }}.exe` - installer with desktop and Start-menu shortcuts
            - `MoM_Toolbox_Portable_v${{ env.VERSION }}.zip` - no install; unzip and run `MoM_Toolbox.exe`

            If Windows shows "Windows protected your PC", click **More info -> Run anyway**.

            To check a download is genuine, compare its SHA-256 with `SHA256SUMS.txt`. In PowerShell: `Get-FileHash <file> -Algorithm SHA256`
